<!doctype html><html lang="en"><meta charset="utf-8"><title>BROCWIN conference poster</title><style>html,body{margin:0;padding:0;background:#f5f3ed}svg{display:block;width:2880px;height:2160px}@page{size:48in 36in;margin:0}@media print{html,body{width:48in;height:36in}svg{width:48in;height:36in}}</style><svg xmlns="http://www.w3.org/2000/svg" width="48in" height="36in" viewBox="0 0 2880 2160" role="img"><title>BROCWIN research poster</title><desc>Ontology, inherited architecture, retained login controls, allocator results, evidence limits, and independent continuation.</desc><rect width="2880" height="2160" fill="#f5f3ed"/><rect x="0" y="0" width="2880" height="290" rx="0" fill="#122c38"/><text x="80" y="64.0" font-family="Arial,sans-serif" font-size="29" fill="#88ded7" font-weight="700" text-anchor="start">HEAV3NS  /  RESEARCH POSTER SESSION</text><text x="80" y="205.0" font-family="Arial,sans-serif" font-size="125" fill="white" font-weight="700" text-anchor="start">BROCWIN</text><text x="1070" y="108.0" font-family="Arial,sans-serif" font-size="43" fill="white" font-weight="700" text-anchor="start">Browser-hosted execution of an inherited Windows MMO client</text><text x="1070" y="222.0" font-family="Arial,sans-serif" font-size="29" fill="#c4d7dc" font-weight="400" text-anchor="start">Commissioned by MAJO, Executive Chair  ·  Presented by Dr. GPT</text><text x="80" y="357.0" font-family="Arial,sans-serif" font-size="43" fill="#122c38" font-weight="700" text-anchor="start">What does it mean for a Windows application to exist outside Windows?</text><text x="80" y="400.0" font-family="Arial,sans-serif" font-size="28" fill="#50636b" font-weight="400" text-anchor="start">Reconstruct sufficient conditions. Retain original compiled logic. Report a bounded result.</text><rect x="80" y="445" width="760" height="440" rx="12" fill="white"/><text x="105" y="493.0" font-family="Arial,sans-serif" font-size="24" fill="#087f80" font-weight="700" text-anchor="start">01</text><text x="158" y="494.0" font-family="Arial,sans-serif" font-size="31" fill="#122c38" font-weight="700" text-anchor="start">What exists in this experiment</text><line x1="105" y1="514" x2="815" y2="514" stroke="#dce6e5" stroke-width="2"/><text x="108" y="554.0" font-family="Arial,sans-serif" font-size="28" fill="#087f80" font-weight="700" text-anchor="start">Application</text><text x="108" y="587.0" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Inherited executable, libraries and content.</text><text x="108" y="622.0" font-family="Arial,sans-serif" font-size="28" fill="#087f80" font-weight="700" text-anchor="start">BROCWIN</text><text x="108" y="655.0" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Selected reconstructed execution conditions.</text><text x="108" y="690.0" font-family="Arial,sans-serif" font-size="28" fill="#087f80" font-weight="700" text-anchor="start">Browser</text><text x="108" y="723.0" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Host for the interpreter and adapters.</text><text x="108" y="758.0" font-family="Arial,sans-serif" font-size="28" fill="#087f80" font-weight="700" text-anchor="start">Native services</text><text x="108" y="791.0" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Existing servers and SQL outside the browser.</text><text x="108" y="826.0" font-family="Arial,sans-serif" font-size="28" fill="#087f80" font-weight="700" text-anchor="start">Research artifact</text><text x="108" y="859.0" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Sources, observations, identities and limits.</text><rect x="80" y="910" width="760" height="375" rx="12" fill="white"/><text x="105" y="958.0" font-family="Arial,sans-serif" font-size="24" fill="#087f80" font-weight="700" text-anchor="start">02</text><text x="158" y="959.0" font-family="Arial,sans-serif" font-size="31" fill="#122c38" font-weight="700" text-anchor="start">Inheritance and intervention</text><line x1="105" y1="979" x2="815" y2="979" stroke="#dce6e5" stroke-width="2"/><text x="108" y="1018.0" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">HEAV3NS-COMBO integrates inherited client</text><text x="108" y="1054.4" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">resources, Wine-Assembly and existing native services.</text><text x="108" y="1090.8" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">The institution did not author the original game.</text><text x="108" y="1147.2" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">Audited disk files were retained. A guarded send</text><text x="108" y="1183.6000000000001" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">wrapper was installed in mapped code padding under</text><text x="108" y="1220.0" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">the original socket lock.</text><text x="108" y="1255.0" font-family="Arial,sans-serif" font-size="21" fill="#50636b" font-weight="400" text-anchor="start">White paper §5 · E16–E17</text><rect x="80" y="1310" width="760" height="340" rx="12" fill="white"/><text x="105" y="1358.0" font-family="Arial,sans-serif" font-size="24" fill="#087f80" font-weight="700" text-anchor="start">03</text><text x="158" y="1359.0" font-family="Arial,sans-serif" font-size="31" fill="#122c38" font-weight="700" text-anchor="start">Strategy and evolution</text><line x1="105" y1="1379" x2="815" y2="1379" stroke="#dce6e5" stroke-width="2"/><text x="108" y="1418.0" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Interpret x86 in Wasm; reconstruct Windows contracts; adapt</text><text x="108" y="1451.8" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">graphics, input and audio; mount resources; retain native</text><text x="108" y="1485.6" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">services.</text><text x="108" y="1531.4" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">Contract repair → cache studies → allocator study. Overall</text><text x="108" y="1565.2" font-family="Arial,sans-serif" font-size="26" fill="#122c38" font-weight="400" text-anchor="start">speedup and full acceptance remain unproven.</text><text x="108" y="1622.0" font-family="Arial,sans-serif" font-size="21" fill="#50636b" font-weight="400" text-anchor="start">White paper §§4, 7–10</text><rect x="80" y="1675" width="760" height="350" rx="12" fill="white"/><text x="105" y="1723.0" font-family="Arial,sans-serif" font-size="24" fill="#087f80" font-weight="700" text-anchor="start">04</text><text x="158" y="1724.0" font-family="Arial,sans-serif" font-size="31" fill="#122c38" font-weight="700" text-anchor="start">Questions beyond this client</text><line x1="105" y1="1744" x2="815" y2="1744" stroke="#dce6e5" stroke-width="2"/><text x="108" y="1780.0" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">Can reconstructed conditions extend software&#x27;s life?</text><text x="108" y="1816.4" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">Can operating-system interfaces become research</text><text x="108" y="1852.8" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">objects? What else must archives preserve for</text><text x="108" y="1889.2" font-family="Arial,sans-serif" font-size="28" fill="#122c38" font-weight="400" text-anchor="start">independent examination?</text><text x="108" y="1940.0" font-family="Arial,sans-serif" font-size="26" fill="#a55313" font-weight="400" text-anchor="start">These are research opportunities, not universal capabilities</text><text x="108" y="1973.8" font-family="Arial,sans-serif" font-size="26" fill="#a55313" font-weight="400" text-anchor="start">demonstrated by this trial.</text><rect x="880" y="445" width="1120" height="685" rx="12" fill="white"/><text x="905" y="493.0" font-family="Arial,sans-serif" font-size="24" fill="#087f80" font-weight="700" text-anchor="start">05</text><text x="958" y="494.0" font-family="Arial,sans-serif" font-size="31" fill="#122c38" font-weight="700" text-anchor="start">Architecture and native boundary</text><line x1="905" y1="514" x2="1975" y2="514" stroke="#dce6e5" stroke-width="2"/><image x="908" y="529" width="1064" height="545" preserveAspectRatio="xMidYMid meet" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI4MjAiIGhlaWdodD0iNDkwIiB2aWV3Qm94PSIwIDAgODIwIDQ5MCI+DQo8ZGVmcz48bWFya2VyIGlkPSJhcnJvdyIgbWFya2VyV2lkdGg9IjgiIG1hcmtlckhlaWdodD0iOCIgcmVmWD0iNyIgcmVmWT0iNCIgb3JpZW50PSJhdXRvIj48cGF0aCBkPSJNMCAwIEw4IDQgTDAgOCIgZmlsbD0iIzUwNjQ3YSIvPjwvbWFya2VyPjwvZGVmcz4NCjxyZWN0IHdpZHRoPSI4MjAiIGhlaWdodD0iNDkwIiBmaWxsPSJ3aGl0ZSIvPg0KPHJlY3QgeD0iMjg1IiB5PSIzNSIgd2lkdGg9IjUyMCIgaGVpZ2h0PSIyODUiIHJ4PSIxMCIgZmlsbD0iI2YzZjZmYSIgc3Ryb2tlPSIjOGJhMGI1Ii8+DQo8dGV4dCB4PSIzMDAiIHk9IjU3IiBmb250LWZhbWlseT0iQXJpYWwiIGZvbnQtc2l6ZT0iMTUiIGZpbGw9IiMyMTM2NGMiPkJyb3dzZXIgZXhlY3V0aW9uIGFuZCByZWNvbnN0cnVjdGVkIGludGVyZmFjZXM8L3RleHQ+DQo8cmVjdCB4PSIzMCIgeT0iNzAiIHdpZHRoPSIyMTAiIGhlaWdodD0iNzAiIHJ4PSI1IiBmaWxsPSJ3aGl0ZSIgc3Ryb2tlPSIjMzQ0ZTY4Ii8+DQo8dGV4dCB4PSIxMzUuMCIgeT0iOTciIHRleHQtYW5jaG9yPSJtaWRkbGUiIGZvbnQtZmFtaWx5PSJBcmlhbCIgZm9udC1zaXplPSIxNiIgZm9udC13ZWlnaHQ9ImJvbGQiIGZpbGw9IiMxODMyNDkiPk9yaWdpbmFsIGNsaWVudCAvIERMTHM8L3RleHQ+DQo8dGV4dCB4PSIxMzUuMCIgeT0iMTIxIiB0ZXh0LWFuY2hvcj0ibWlkZGx
