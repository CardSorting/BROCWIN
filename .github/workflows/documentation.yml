name: Documentation and community files
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  community-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check repository documents and notices
        run: python scripts/check_repository.py
# Designed for theseus as a standalone repository root. No dependency install,
# runtime build/test, browser capture, backend provisioning or release occurs.
